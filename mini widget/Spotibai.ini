[Rainmeter]
Update=500
AccurateText=1
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
MouseScrollUpAction=[!CommandMeasure MeasureResize "Grow()"]
MouseScrollDownAction=[!CommandMeasure MeasureResize "Shrink()"]

[Metadata]
Name=Spotibar Small
Author=Spotibar
Information=Compact Spotibar player powered by WebNowPlaying.
Version=1.0

[Variables]
CardWidth=320
CardHeight=320
Scale=100
MinScale=70
MaxScale=150
ScaleStep=10
CardColor=28,39,53,255
InkColor=248,245,246,255
MutedColor=200,189,196,255
AccentColor=241,184,197,255
CardRadius=38
CoverRadius=20

[MeasureResize]
Measure=Script
ScriptFile=#@#Scripts\Resize.lua

[MeasureTitle]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Title

[MeasureArtist]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Artist

[MeasureCover]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Cover

[MeasurePosition]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Position
Substitute="::"=":"

[MeasureDuration]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Duration
Substitute="::"=":"

[MeasureProgress]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Progress
MinValue=0
MaxValue=100

[MeasureState]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=State

[MeasureShuffle]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Shuffle

[MeasureRepeat]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Repeat

[MeterCard]
Meter=Shape
X=0
Y=0
W=(#CardWidth#*#Scale#/100)
H=(#CardHeight#*#Scale#/100)
Shape=Rectangle 0,0,#CardWidth#,#CardHeight#,#CardRadius# | Fill Color #CardColor# | StrokeWidth 0
DynamicVariables=1

[MeterCoverFallback]
Meter=Shape
X=(24*#Scale#/100)
Y=(24*#Scale#/100)
W=(160*#Scale#/100)
H=(160*#Scale#/100)
Shape=Rectangle 0,0,160,160,#CoverRadius# | Fill Color 70,62,69,255 | StrokeWidth 0
DynamicVariables=1

[MeterCover]
Meter=Image
MeasureName=MeasureCover
X=(24*#Scale#/100)
Y=(24*#Scale#/100)
W=(160*#Scale#/100)
H=(160*#Scale#/100)
PreserveAspectRatio=2
MaskImageName=#@#Images\cover-mask.png
DynamicVariables=1

[MeterSpotifyMark]
Meter=Shape
X=(254*#Scale#/100)
Y=(24*#Scale#/100)
W=(44*#Scale#/100)
H=(44*#Scale#/100)
Shape=Ellipse 22,22,22 | Fill Color 248,245,246,255 | StrokeWidth 0
Shape2=Curve 10,14,34,17,22,6,0 | StrokeWidth 3 | Stroke Color #CardColor#
Shape3=Curve 12,22,32,25,22,15,0 | StrokeWidth 3 | Stroke Color #CardColor#
Shape4=Curve 15,30,29,32,22,24,0 | StrokeWidth 3 | Stroke Color #CardColor#
DynamicVariables=1

[MeterSize]
Meter=String
X=(278*#Scale#/100)
Y=(80*#Scale#/100)
W=(30*#Scale#/100)
H=(18*#Scale#/100)
FontFace=Segoe UI
FontSize=(9*#Scale#/100)
FontWeight=700
FontColor=#AccentColor#
AntiAlias=1
Text=BIG
ToolTipText=Switch to big size
DynamicVariables=1
LeftMouseUpAction=[!DeactivateConfig][!ActivateConfig "#CURRENTCONFIG#" "Spotibar.ini"]

[MeterShrink]
Meter=String
X=(242*#Scale#/100)
Y=(80*#Scale#/100)
W=(14*#Scale#/100)
H=(18*#Scale#/100)
FontFace=Segoe UI
FontSize=(12*#Scale#/100)
FontWeight=700
FontColor=#AccentColor#
AntiAlias=1
Text=-
ToolTipText=Make smaller
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureResize "Shrink()"]

[MeterGrow]
Meter=String
X=(260*#Scale#/100)
Y=(80*#Scale#/100)
W=(14*#Scale#/100)
H=(18*#Scale#/100)
FontFace=Segoe UI
FontSize=(12*#Scale#/100)
FontWeight=700
FontColor=#AccentColor#
AntiAlias=1
Text=+
ToolTipText=Make bigger
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureResize "Grow()"]

[MeterTitle]
Meter=String
MeasureName=MeasureTitle
X=(24*#Scale#/100)
Y=(204*#Scale#/100)
W=(180*#Scale#/100)
H=(27*#Scale#/100)
FontFace=Segoe UI
FontSize=(20*#Scale#/100)
FontWeight=700
FontColor=#InkColor#
ClipString=1
AntiAlias=1
Text=%1
DynamicVariables=1

[MeterArtist]
Meter=String
MeasureName=MeasureArtist
X=(24*#Scale#/100)
Y=(231*#Scale#/100)
W=(180*#Scale#/100)
H=(22*#Scale#/100)
FontFace=Segoe UI
FontSize=(16*#Scale#/100)
FontWeight=700
FontColor=#MutedColor#
ClipString=1
AntiAlias=1
Text=%1
DynamicVariables=1

[MeterShuffleOff]
Meter=Image
ImageName=#@#Images\Controls\shuffle.png
X=(29*#Scale#/100)
Y=(264*#Scale#/100)
W=(18*#Scale#/100)
H=(18*#Scale#/100)
Hidden=([MeasureShuffle] = 1)
ToolTipText=Shuffle
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Shuffle"]

[MeterShuffleOn]
Meter=Image
ImageName=#@#Images\Controls\shuffle-active.png
X=(29*#Scale#/100)
Y=(264*#Scale#/100)
W=(18*#Scale#/100)
H=(18*#Scale#/100)
Hidden=([MeasureShuffle] <> 1)
ToolTipText=Turn shuffle off
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Shuffle"]

[MeterPrevious]
Meter=Image
ImageName=#@#Images\Controls\previous.png
X=(75*#Scale#/100)
Y=(262*#Scale#/100)
W=(22*#Scale#/100)
H=(22*#Scale#/100)
ToolTipText=Previous track
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Previous"]

[MeterPlay]
Meter=Image
ImageName=#@#Images\Controls\play.png
X=(142*#Scale#/100)
Y=(254*#Scale#/100)
W=(36*#Scale#/100)
H=(36*#Scale#/100)
Hidden=([MeasureState] = 1)
DynamicVariables=1
ToolTipText=Play
LeftMouseUpAction=[!CommandMeasure MeasureTitle "PlayPause"]

[MeterPause]
Meter=Image
ImageName=#@#Images\Controls\pause.png
X=(142*#Scale#/100)
Y=(254*#Scale#/100)
W=(36*#Scale#/100)
H=(36*#Scale#/100)
Hidden=([MeasureState] <> 1)
DynamicVariables=1
ToolTipText=Pause
LeftMouseUpAction=[!CommandMeasure MeasureTitle "PlayPause"]

[MeterNext]
Meter=Image
ImageName=#@#Images\Controls\next.png
X=(223*#Scale#/100)
Y=(262*#Scale#/100)
W=(22*#Scale#/100)
H=(22*#Scale#/100)
ToolTipText=Next track
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Next"]

[MeterRepeatOff]
Meter=Image
ImageName=#@#Images\Controls\repeat.png
X=(273*#Scale#/100)
Y=(264*#Scale#/100)
W=(18*#Scale#/100)
H=(18*#Scale#/100)
Hidden=([MeasureRepeat] <> 0)
ToolTipText=Repeat
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Repeat"]

[MeterRepeatOn]
Meter=Image
ImageName=#@#Images\Controls\repeat-active.png
X=(273*#Scale#/100)
Y=(264*#Scale#/100)
W=(18*#Scale#/100)
H=(18*#Scale#/100)
Hidden=([MeasureRepeat] = 0)
ToolTipText=Turn repeat off
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Repeat"]

[MeterProgress]
Meter=Bar
MeasureName=MeasureProgress
X=(57*#Scale#/100)
Y=(305*#Scale#/100)
W=(190*#Scale#/100)
H=(4*#Scale#/100)
BarOrientation=Horizontal
BarColor=#AccentColor#
SolidColor=93,84,91,255
DynamicVariables=1

[MeterPosition]
Meter=String
MeasureName=MeasurePosition
X=(8*#Scale#/100)
Y=(297*#Scale#/100)
W=(38*#Scale#/100)
H=(16*#Scale#/100)
FontFace=Segoe UI
FontSize=(8*#Scale#/100)
FontColor=#MutedColor#
AntiAlias=1
Text=%1
DynamicVariables=1

[MeterDuration]
Meter=String
MeasureName=MeasureDuration
X=(282*#Scale#/100)
Y=(297*#Scale#/100)
W=(30*#Scale#/100)
H=(16*#Scale#/100)
FontFace=Segoe UI
FontSize=(8*#Scale#/100)
FontColor=#MutedColor#
StringAlign=Right
AntiAlias=1
Text=%1
DynamicVariables=1
