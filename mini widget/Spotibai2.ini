[Rainmeter]
Update=500
AccurateText=1
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
MouseScrollUpAction=[!CommandMeasure MeasureResize "Grow()"]
MouseScrollDownAction=[!CommandMeasure MeasureResize "Shrink()"]

[Metadata]
Name=Spotibar
Author=Spotibar
Information=A compact music player skin powered by WebNowPlaying.
Version=1.0

[Variables]
CardWidth=520
CardHeight=210
Scale=100
MinScale=70
MaxScale=150
ScaleStep=10
CardColor=48,43,48,255
InkColor=248,245,246,255
MutedColor=200,189,196,255
AccentColor=241,184,197,255
CardRadius=28
CoverRadius=18

[MeasureResize]
Measure=Script
ScriptFile=#@#Scripts\Resize.lua

[MeasureTitle]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Title

[MeasureTitleSearch]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Title
Substitute="%":"%25"," ":"%20","#":"%23","&":"%26","?":"%3F"

[MeasureArtist]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Artist

[MeasureArtistSearch]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Artist
Substitute="%":"%25"," ":"%20","#":"%23","&":"%26","?":"%3F"

[MeasureAlbum]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Album

[MeasureCover]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Cover

[MeasurePosition]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Position
Substitute="::"=":"

[MeasureDuration]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Duration
Substitute="::"=":"

[MeasureProgress]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Progress
MinValue=0
MaxValue=100

[MeasureState]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=State

[MeasureShuffle]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Shuffle

[MeasureRepeat]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Repeat

[MeterCard]
Meter=Shape
X=0
Y=0
W=(#CardWidth#*#Scale#/100)
H=(#CardHeight#*#Scale#/100)
Shape=Rectangle 0,0,#CardWidth#,#CardHeight#,#CardRadius# | Fill Color #CardColor# | StrokeWidth 0
DynamicVariables=1

[MeterCoverFallback]
Meter=Shape
X=(18*#Scale#/100)
Y=(18*#Scale#/100)
W=(160*#Scale#/100)
H=(160*#Scale#/100)
Shape=Rectangle 0,0,160,160,#CoverRadius# | Fill Color 70,62,69,255 | StrokeWidth 0
DynamicVariables=1

[MeterCover]
Meter=Image
MeasureName=MeasureCover
X=(18*#Scale#/100)
Y=(18*#Scale#/100)
W=(160*#Scale#/100)
H=(160*#Scale#/100)
PreserveAspectRatio=2
DynamicVariables=1

[MeterLyrics]
Meter=String
X=(466*#Scale#/100)
Y=(10*#Scale#/100)
W=(44*#Scale#/100)
H=(18*#Scale#/100)
FontFace=Segoe UI
FontSize=(9*#Scale#/100)
FontWeight=700
FontColor=#AccentColor#
AntiAlias=1
Text=LYRICS
ToolTipText=Open this track in Spotify to view lyrics
DynamicVariables=1
LeftMouseUpAction=["https://open.spotify.com/search/[MeasureTitleSearch]%20[MeasureArtistSearch]"]
MouseOverAction=[!SetOption MeterLyrics FontColor "#InkColor#"][!UpdateMeter MeterLyrics][!Redraw]
MouseLeaveAction=[!SetOption MeterLyrics FontColor "#AccentColor#"][!UpdateMeter MeterLyrics][!Redraw]

[MeterShrink]
Meter=String
X=(424*#Scale#/100)
Y=(10*#Scale#/100)
W=(14*#Scale#/100)
H=(18*#Scale#/100)
FontFace=Segoe UI
FontSize=(12*#Scale#/100)
FontWeight=700
FontColor=#AccentColor#
AntiAlias=1
Text=-
ToolTipText=Make smaller
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureResize "Shrink()"]

[MeterGrow]
Meter=String
X=(442*#Scale#/100)
Y=(10*#Scale#/100)
W=(14*#Scale#/100)
H=(18*#Scale#/100)
FontFace=Segoe UI
FontSize=(12*#Scale#/100)
FontWeight=700
FontColor=#AccentColor#
AntiAlias=1
Text=+
ToolTipText=Make bigger
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureResize "Grow()"]

[MeterTitle]
Meter=String
MeasureName=MeasureTitle
X=(200*#Scale#/100)
Y=(30*#Scale#/100)
W=(300*#Scale#/100)
H=(34*#Scale#/100)
FontFace=Segoe UI
FontSize=(23*#Scale#/100)
FontWeight=700
FontColor=#InkColor#
ClipString=1
AntiAlias=1
Text=%1
DynamicVariables=1

[MeterArtist]
Meter=String
MeasureName=MeasureArtist
X=(202*#Scale#/100)
Y=(64*#Scale#/100)
W=(290*#Scale#/100)
H=(25*#Scale#/100)
FontFace=Segoe UI
FontSize=(16*#Scale#/100)
FontColor=#MutedColor#
ClipString=1
AntiAlias=1
Text=%1
DynamicVariables=1

[MeterAlbum]
Meter=String
MeasureName=MeasureAlbum
X=(202*#Scale#/100)
Y=(87*#Scale#/100)
W=(290*#Scale#/100)
H=(20*#Scale#/100)
FontFace=Segoe UI
FontSize=(10*#Scale#/100)
FontColor=169,157,165,255
ClipString=1
AntiAlias=1
Text=%1
DynamicVariables=1

[MeterShuffleOff]
Meter=Image
ImageName=#@#Images\Controls\shuffle.png
X=(235*#Scale#/100)
Y=(139*#Scale#/100)
W=(20*#Scale#/100)
H=(20*#Scale#/100)
Hidden=([MeasureShuffle] = 1)
ToolTipText=Shuffle
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Shuffle"]

[MeterShuffleOn]
Meter=Image
ImageName=#@#Images\Controls\shuffle-active.png
X=(235*#Scale#/100)
Y=(139*#Scale#/100)
W=(20*#Scale#/100)
H=(20*#Scale#/100)
Hidden=([MeasureShuffle] <> 1)
ToolTipText=Turn shuffle off
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Shuffle"]

[MeterPrevious]
Meter=Image
ImageName=#@#Images\Controls\previous.png
X=(282*#Scale#/100)
Y=(137*#Scale#/100)
W=(24*#Scale#/100)
H=(24*#Scale#/100)
ToolTipText=Previous track
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Previous"]

[MeterPlay]
Meter=Image
ImageName=#@#Images\Controls\play.png
X=(324*#Scale#/100)
Y=(127*#Scale#/100)
W=(40*#Scale#/100)
H=(40*#Scale#/100)
Hidden=([MeasureState] = 1)
DynamicVariables=1
ToolTipText=Play
LeftMouseUpAction=[!CommandMeasure MeasureTitle "PlayPause"]

[MeterPause]
Meter=Image
ImageName=#@#Images\Controls\pause.png
X=(324*#Scale#/100)
Y=(127*#Scale#/100)
W=(40*#Scale#/100)
H=(40*#Scale#/100)
Hidden=([MeasureState] <> 1)
DynamicVariables=1
ToolTipText=Pause
LeftMouseUpAction=[!CommandMeasure MeasureTitle "PlayPause"]

[MeterNext]
Meter=Image
ImageName=#@#Images\Controls\next.png
X=(382*#Scale#/100)
Y=(137*#Scale#/100)
W=(24*#Scale#/100)
H=(24*#Scale#/100)
ToolTipText=Next track
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Next"]

[MeterRepeatOff]
Meter=Image
ImageName=#@#Images\Controls\repeat.png
X=(432*#Scale#/100)
Y=(139*#Scale#/100)
W=(20*#Scale#/100)
H=(20*#Scale#/100)
Hidden=([MeasureRepeat] <> 0)
ToolTipText=Repeat
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Repeat"]

[MeterRepeatOn]
Meter=Image
ImageName=#@#Images\Controls\repeat-active.png
X=(432*#Scale#/100)
Y=(139*#Scale#/100)
W=(20*#Scale#/100)
H=(20*#Scale#/100)
Hidden=([MeasureRepeat] = 0)
ToolTipText=Turn repeat off
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Repeat"]

[MeterSize]
Meter=String
X=(482*#Scale#/100)
Y=(138*#Scale#/100)
W=(24*#Scale#/100)
H=(18*#Scale#/100)
FontFace=Segoe UI
FontSize=(9*#Scale#/100)
FontWeight=700
FontColor=#AccentColor#
AntiAlias=1
Text=SM
ToolTipText=Switch to small size
DynamicVariables=1
LeftMouseUpAction=[!DeactivateConfig][!ActivateConfig "#CURRENTCONFIG#" "Spotibar-Small.ini"]

[MeterPosition]
Meter=String
MeasureName=MeasurePosition
X=(202*#Scale#/100)
Y=(176*#Scale#/100)
W=(40*#Scale#/100)
H=(16*#Scale#/100)
FontFace=Segoe UI
FontSize=(9*#Scale#/100)
FontColor=#MutedColor#
AntiAlias=1
Text=%1
DynamicVariables=1

[MeterProgress]
Meter=Bar
MeasureName=MeasureProgress
X=(250*#Scale#/100)
Y=(182*#Scale#/100)
W=(190*#Scale#/100)
H=(4*#Scale#/100)
BarOrientation=Horizontal
BarColor=#AccentColor#
SolidColor=93,84,91,255
DynamicVariables=1

[MeterDuration]
Meter=String
MeasureName=MeasureDuration
X=(474*#Scale#/100)
Y=(176*#Scale#/100)
W=(36*#Scale#/100)
H=(16*#Scale#/100)
FontFace=Segoe UI
FontSize=(9*#Scale#/100)
FontColor=#MutedColor#
StringAlign=Right
AntiAlias=1
Text=%1
DynamicVariables=1
